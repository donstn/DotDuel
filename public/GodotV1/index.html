	const HOLES = 10;
	const holes = [];
	for (let i = 0; i < HOLES; i++) {
		const h = document.createElement('div');
		h.className = 'hole';
		h.appendChild(document.createElement('i'));
		h.style.setProperty('--i', i);
		track.appendChild(h);
		holes.push(h);

		const f = document.createElement('div');

		f.style.top = (55 + Math.random() * 45) + '%';

		f.style.animationDelay = (-Math.random() * 10) + 's';
		loader.appendChild(f);

	let tipIdx = Math.floor(Math.random() * TIPS.length);
	function nextTip() {
		tip.style.opacity = 0;
		setTimeout(() => { tip.innerHTML = TIPS[tipIdx]; tip.style.opacity = 1; tipIdx = (tipIdx + 1) % TIPS.length; }, 400);
	}
	tip.innerHTML = TIPS[tipIdx]; tipIdx = (tipIdx + 1) % TIPS.length;

	let shown = 0;

		const p = Math.max(0, Math.min(1, frac));

		shown = n;
		const lit = Math.floor(p * HOLES + 1e-6);

	let hidden = false;
	const hide = () => {
		if (hidden) return;
		hidden = true;
		clearInterval(tipTimer);
		loader.classList.add('done');
		setTimeout(() => loader.remove(), 600);
	};
	// Called by the game (main.gd) once the menu, a saved game or the welcome
	// card is on screen.
	window.ddBooted = hide;
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				if (current >= total) starting();
				else if (!started) setProgress(current / total);
			}
		},
	}).then(() => {
		starting();
		setTimeout(hide, 8000);
	}, fail);
}());
</script>
</body>
</html>
