<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1d14">
<title>DotDuel (Godot test)</title>
<!-- Loader art comes from the main site's public/ (same origin, already cached for returning players). -->
<link rel="preload" as="image" href="/art/forest-pearl/background-portrait.webp">
<link rel="preload" as="image" href="/art/forest-pearl/header-combined.webp">
<style>
@font-face { font-family: Outfit; src: url(/fonts/outfit-var.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #0c1d14; color: #eaf3e3; overflow: hidden; touch-action: none; font-family: Outfit, system-ui, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#loader {
	position: fixed; inset: 0; z-index: 2;
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	gap: 4vh; padding: 6vh 6vw; box-sizing: border-box;
	background: #0c1d14 url(/art/forest-pearl/background-portrait.webp) center / cover no-repeat;
	transition: opacity .5s ease;
}
@media (orientation: landscape) { #loader { background-image: url(/art/forest-pearl/background-landscape.webp); } }
#loader::before { /* vignette so the text reads on the bright forest */
	content: ""; position: absolute; inset: 0; pointer-events: none;
	background: radial-gradient(ellipse at 50% 45%, rgba(4,18,10,.15) 0%, rgba(4,18,10,.55) 70%, rgba(4,18,10,.8) 100%);
}
#loader.done { opacity: 0; pointer-events: none; }
#loader > :not(.fly) { position: relative; }

.sign { width: min(88vw, 520px, 60vh); aspect-ratio: 660 / 305; position: relative; container-type: inline-size; filter: drop-shadow(0 10px 24px rgba(0,0,0,.5)); }
.sign img { width: 100%; height: 100%; display: block; }
/* tagline sits on the sign's empty wooden plaque, as in the game menu */
.tag { position: absolute; left: 12%; right: 12%; top: 60%; bottom: 8.5%; display: flex; align-items: center; justify-content: center;
	font-size: 4.6cqw; font-weight: 500; line-height: 1.25; color: rgba(234,243,227,.92); text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.7); }

.track {
	display: flex; gap: clamp(4px, 1.4vw, 9px); padding: clamp(8px, 2vw, 12px) clamp(10px, 2.6vw, 16px);
	border-radius: 999px; background: rgba(6,22,13,.82); border: 2px solid rgba(123,219,149,.35);
	box-shadow: 0 8px 30px rgba(0,0,0,.45), inset 0 2px 10px rgba(0,0,0,.6);
}
.hole {
	width: clamp(16px, min(5.6vw, 7vh), 30px); aspect-ratio: 1; border-radius: 50%; position: relative;
	background: radial-gradient(circle at 50% 62%, #12301d 0 55%, #050f09 70%);
	box-shadow: inset 0 3px 5px rgba(0,0,0,.8);
}
.hole i {
	position: absolute; inset: -6%; border-radius: 50%; background: center / contain no-repeat;
	transform: scale(0); opacity: 0; transition: transform .38s cubic-bezier(.34,1.7,.5,1), opacity .2s;
}
.hole:nth-child(odd) i { background-image: url(/art/forest-pearl/dot-p1.webp); }
.hole:nth-child(even) i { background-image: url(/art/forest-pearl/dot-p2.webp); }
.hole.on i { transform: scale(1); opacity: 1; }

.pct { text-align: center; font-size: clamp(22px, 6vw, 30px); font-weight: 700; letter-spacing: .04em; text-shadow: 0 2px 10px rgba(0,0,0,.8); font-variant-numeric: tabular-nums; }
.pct small { display: block; font-size: .55em; font-weight: 500; opacity: .75; letter-spacing: 0; text-align: center; }
.tip {
	max-width: min(88vw, 460px); min-height: 3.2em; text-align: center; line-height: 1.4;
	font-size: clamp(14px, 3.8vw, 18px); color: #d3ecaa; text-shadow: 0 2px 8px rgba(0,0,0,.85);
	transition: opacity .4s;
}
.tip b { color: #7bdb95; font-weight: 600; }
.notice { display: none; max-width: 86vw; padding: 14px 18px; border-radius: 14px; background: #5b3943; border: 1px solid #9b3943; text-align: center; line-height: 1.4; }

.fly { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #f4ffb0; box-shadow: 0 0 10px 3px rgba(230,255,140,.55); opacity: 0; pointer-events: none; animation: drift linear infinite; }
@keyframes drift {
	0% { transform: translate(0, 0); opacity: 0; }
	15% { opacity: .9; }
	50% { transform: translate(var(--dx), -18vh); opacity: .5; }
	85% { opacity: .9; }
	100% { transform: translate(calc(var(--dx) * -0.5), -36vh); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .fly { display: none; } .hole i { transition: none; } }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>DotDuel needs JavaScript.</noscript>

<div id="loader" role="status" aria-live="polite">
	<div class="sign"><img src="/art/forest-pearl/header-combined.webp" alt="DotDuel"><div class="tag">Colour dots. Finish lines.<br>Outscore your rival.</div></div>
	<div class="track" id="track" aria-hidden="true"></div>
	<div class="pct" id="pct">0%<small>Loading the forest…</small></div>
	<div class="tip" id="tip"></div>
	<div class="notice" id="notice"></div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":4519108,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const track = document.getElementById('track');
	const pct = document.getElementById('pct');
	const tip = document.getElementById('tip');
	const notice = document.getElementById('notice');
	const HOLES = 10;
	const holes = [];
	for (let i = 0; i < HOLES; i++) {
		const h = document.createElement('div');
		h.className = 'hole';
		h.appendChild(document.createElement('i'));
		track.appendChild(h);
		holes.push(h);
	}
	for (let i = 0; i < 14; i++) {
		const f = document.createElement('div');
		f.className = 'fly';
		f.style.left = (Math.random() * 100) + '%';
		f.style.top = (55 + Math.random() * 45) + '%';
		f.style.setProperty('--dx', ((Math.random() - 0.5) * 16) + 'vw');
		f.style.animationDuration = (7 + Math.random() * 7) + 's';
		f.style.animationDelay = (-Math.random() * 10) + 's';
		loader.appendChild(f);
	}

	const TIPS = [
		'Complete a line to score <b>its length</b> in points.',
		'Finish several lines at once? Only the <b>longest</b> scores. The rest wait as <b>pending</b> lines.',
		'Any player can <b>claim</b> a pending line: tap one of its coloured dots.',
		'A corner dot is a line of its own: <b>1 point</b>.',
		'Before you place a dot, check what it sets up for your rival.',
		'Ranked games use the <b>same rating</b> as the DotDuel app.',
	];
	let tipIdx = Math.floor(Math.random() * TIPS.length);
	function nextTip() {
		tip.style.opacity = 0;
		setTimeout(() => { tip.innerHTML = TIPS[tipIdx]; tip.style.opacity = 1; tipIdx = (tipIdx + 1) % TIPS.length; }, 400);
	}
	tip.innerHTML = TIPS[tipIdx]; tipIdx = (tipIdx + 1) % TIPS.length;
	const tipTimer = setInterval(nextTip, 4500);

	let shown = 0;
	function setProgress(frac) {
		const p = Math.max(0, Math.min(1, frac));
		const n = Math.round(p * 100);
		if (n < shown) return;
		shown = n;
		const lit = Math.floor(p * HOLES + 1e-6);
		holes.forEach((h, i) => h.classList.toggle('on', i < lit));
		pct.firstChild.nodeValue = n + '%';
		if (n >= 100) pct.lastChild.textContent = 'Starting…';
	}
	function fail(err) {
		console.error(err);
		clearInterval(tipTimer);
		notice.textContent = (err && err.message) ? err.message : String(err || 'Something went wrong while loading.');
		notice.style.display = 'block';
		pct.lastChild.textContent = 'Could not start. Try reloading the page.';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing features DotDuel needs:\n' + missing.join(', '));
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) setProgress(current / total);
		},
	}).then(() => {
		setProgress(1);
		clearInterval(tipTimer);
		loader.classList.add('done');
		setTimeout(() => loader.remove(), 600);
	}, fail);
}());
</script>
</body>
</html>
